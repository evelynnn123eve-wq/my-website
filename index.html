<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #eef2ff;
      --shadow: 0 12px 30px rgba(79, 70, 229, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 72px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      color: var(--muted);
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-btn {
      padding: 12px 22px;
      background: var(--primary);
      color: white;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .hero {
      padding: 90px 0 60px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 40px;
    }

    .hello {
      font-size: 1.1rem;
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2.8rem, 5vw, 5rem);
      line-height: 1.1;
      margin: 0 0 18px;
    }

    .highlight {
      color: var(--primary);
    }

    .subtitle {
      font-size: 1.08rem;
      color: var(--muted);
      max-width: 600px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: #f8fafc;
    }

    .stats {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      color: var(--text);
    }

    .avatar-card {
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      border: 1px solid rgba(79, 70, 229, 0.12);
      border-radius: 30px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .avatar-wrap {
      background: linear-gradient(135deg, #c7d2fe, #e0e7ff);
      border-radius: 24px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .avatar {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 5rem;
      font-weight: 700;
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.25);
      position: relative;
      z-index: 2;
    }

    .avatar-wrap::before,
    .avatar-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
    }

    .avatar-wrap::before {
      width: 220px;
      height: 220px;
      top: 12%;
      right: 10%;
    }

    .avatar-wrap::after {
      width: 160px;
      height: 160px;
      bottom: 8%;
      left: 12%;
    }

    section {
      padding: 50px 0;
    }

    .section-title {
      font-size: 2.1rem;
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.03);
    }

    .about-text p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1rem;
    }

    .info-list {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .info-item strong {
      color: var(--text);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .skill-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
    }

    .skill-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .skill-card h3 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .skill-card p {
      margin: 0;
      color: var(--muted);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .project-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
    }

    .project-thumb {
      height: 180px;
      background: linear-gradient(135deg, #dbeafe, #e0e7ff, #f5f3ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: var(--primary-dark);
      font-weight: 800;
    }

    .project-content {
      padding: 22px;
    }

    .project-content h3 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .project-content p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .contact-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .contact-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px;
    }

    .contact-box h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.35rem;
    }

    .contact-list {
      display: grid;
      gap: 14px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .contact-item .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.12);
    }

    footer {
      padding: 30px 0 60px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero-inner,
      .about-grid,
      .contact-wrap {
        grid-template-columns: 1fr;
      }

      .skills-grid,
      .projects-grid {
        grid-template-columns: 1fr 1fr;
      }

      .nav-links {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .skills-grid,
      .projects-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 60px;
      }

      .stats {
        gap: 14px;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo"><span>MY</span>PORTFOLIO</div>
      <nav class="nav-links">
        <a href="#about">关于我</a>
        <a href="#skills">技能</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </nav>
      <a class="nav-btn" href="#contact">联系我</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <div class="hello">HELLO, I'M</div>
          <h1>小 <span class="highlight">明</span> <br />前端开发者</h1>
          <p class="subtitle">
            我专注于 Web 前端开发，喜欢用代码创造清晰、美观且高效的用户体验。
            目前关注 React、Vue、HTML/CSS*

